# Auto-Code agent composition — DeepSeek Harness plugin tree.
#
# Handed to the SDK runtime as DSH_CORDIS_CONFIG. This is a full replacement
# for the runtime's bundled default, not an overlay: every plugin the agent
# gets is listed here, so anything absent is genuinely absent at runtime.
#
# The point of this file is what it LEAVES OUT. The bundled default mounts
# `dsh-bash-local`, which registers a model-facing `bash` tool. Artists edit
# their own sites through this agent, so it gets file tools and no shell —
# not a shell behind an allow-list. There is no command to escape from, which
# is a much shorter thing to reason about than the allow-list opencode ran
# behind.
#
# Verified 2026-08-24 against deepseek-harness-sdk 0.1.1rc1: a two-page edit
# completes using only read/edit/glob and never calls a shell tool, because
# no shell tool is registered for it to call.
#
# Every plugin named here is baked into the SDK runtime binary
# (dsh-jsonrpc-agent-pkg-linux-x64); this file cannot pull in new code.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# Resolves DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL from the environment. Adze
# points those at OpenRouter (see dsh_agent.py) so the existing OpenRouter
# key is the only credential involved and no new dependency is introduced.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Process-spawning *service*, not a model-facing tool. It is here only
# because `dsh-tool-fs-search` shells out to the bundled ripgrep and refuses
# to activate without it — omit this and the whole plugin tree fails to boot
# with "dsh-tool-fs-search: pending (waiting for service: subprocess)".
#
# Note what is still absent: `dsh-bash-local`, which is the plugin that
# registers the model-facing `bash` tool. The model cannot reach this service
# directly; only fs-search can.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# ── Filesystem containment ───────────────────────────────────────────────
#
# `fs-local` used to be mounted here with `cwd: DSH_CWD` and a comment claiming
# that "the filesystem provider cannot see another artist's files". That was
# FALSE, and it was false in the worst way: it read as a guarantee, the agent
# believed it, and nothing enforced it. Upstream says so in its own docs —
# fs-local resolves relative paths from `cwd`, which is "a resolution default,
# NOT a containment boundary ... enforce containment with a stricter backend or
# a `tools/execute` permission plugin".
#
# Absolute paths were never clamped. Verified 2026-08-25 by driving a test
# artist's session: in one turn the model listed `/` and `/app`, read another
# artist's `config.json` (admin_token, last_login_ip) and their `_vibe_sessions`
# chat history, and then CREATED AND EDITED FILES in that artist's live site.
#
# `fs-sandbox` is upstream's "stricter backend". It registers as `ctx.fs`
# INSTEAD OF fs-local (it subclasses it, so all the read/write/edit mechanics
# are the same code) and adds a policy fence on the two mutations. It requires
# `sandbox-policy` for `ctx.sandboxPolicy`, which is why that is mounted first.
#
# `workspace-write` resolves the boundary per call from the SESSION's cwd
# (`sandboxPolicy.resolve()` prefers `session.header.cwd` over the configured
# fallback), and dsh_agent starts every session with cwd = that artist's
# directory. So the fence is automatically per-artist, and worktree tabs are
# fenced to their own worktree, with no extra wiring.
#
# ⚠ THIS FENCES WRITES, NOT READS. Upstream is explicit: "Reads pass through
# untouched: every mode permits reading." There is no read fence anywhere in
# the runtime — `readableRoots` does not exist — and `grep`/`glob` shell out to
# ripgrep through the subprocess service, bypassing `ctx.fs` entirely. A
# determined session can still READ any artist's files, so an artist's
# `admin_token` is still reachable by a model that goes looking. Closing that
# needs either a `tools/execute` permission plugin that gates every call, or
# OS-level confinement of the runtime process (bwrap/Landlock/mount namespace —
# none of which this container currently has: no bwrap, no CAP_SYS_ADMIN, and
# `unshare` returns EPERM). Treat artist config secrets as reachable until then.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

# Inherits fs-local's Config schema (`cwd`, `diffBasisMaxBytes`) because
# SandboxedFileSystem extends LocalFileSystem without redeclaring it.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# The fs backend on its own exposes no model-facing tools; these three are
# the entire tool surface the model gets.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# `sampleOverCapGlobResults` is required and has no default — omit it and the
# whole tree fails to boot with a cordis ValidationError, not a warning.
# false = an over-cap glob keeps the modification-time-ordered head, which
# suits an artist site (the pages someone just touched) better than sampling
# across top-level entries.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
    maxResults: 200

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000
