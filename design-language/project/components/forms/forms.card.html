<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 32px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 620px; }
  .stack { display: flex; flex-direction: column; gap: 26px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Field, Checkbox, Switch } = window.LastPlaceDesignSystem_2f29fe;
    function Demo() {
      const [name, setName] = React.useState("Jane Appleseed");
      const [ok, setOk] = React.useState(true);
      const [rm, setRm] = React.useState(false);
      return (
        <div className="grid">
          <div className="stack">
            <Field label="Your name" value={name} onChange={e => setName(e.target.value)} />
            <Field label="Email" placeholder="you@studio.com" hint="We reply within a day." />
            <Field label="Budget" error="Please choose a range." placeholder="£" />
          </div>
          <div className="stack">
            <Field label="Tell us about the project" multiline placeholder="A sentence or two is plenty." />
            <Checkbox checked={ok} onChange={setOk} label="Keep me posted" />
            <Checkbox checked={false} onChange={() => {}} label="Unchecked option" />
            <Switch checked={rm} onChange={setRm} label="Reduce motion" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
