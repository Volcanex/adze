<!-- @dsCard group="Type" viewport="700x170" name="Mono labels" subtitle="The administrative voice: tracked, uppercase monospace" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 32px; background: var(--surface-page); display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .cap { font-family: var(--font-mono); font-size: 13px; line-height: 1.4; color: var(--text-muted); max-width: 60ch; }
</style>
</head>
<body>
  <div class="row">
    <span class="lp-label">Index</span>
    <span class="lp-label">Selected Works</span>
    <span class="lp-label">Studio — Est. 2022</span>
    <span class="lp-label" style="color:var(--lp-blue)">↳ View project</span>
  </div>
  <p class="cap">Captions and metadata also sit in the monospace, a half-step quieter than the labels — for figure notes, dates, and credits.</p>
</body>
</html>
