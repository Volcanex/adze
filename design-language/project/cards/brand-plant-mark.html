<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--surface-page); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .panel { border: var(--hairline); display: flex; align-items: center; justify-content: center; height: 260px; padding: 20px; }
  .panel.blue { background: var(--lp-blue); border-color: var(--lp-blue); }
  .panel img { height: 100%; width: auto; object-fit: contain; }
  .lab { position: absolute; }
</style>
</head>
<body>
  <div class="panel"><img src="../assets/plant-mark-blue.png" alt="Last Place plant mark" /></div>
  <div class="panel blue"><img src="../assets/plant-mark-blue-knockout.png" alt="Last Place plant mark, knockout" style="filter: brightness(0) invert(1);" /></div>
</body>
</html>
