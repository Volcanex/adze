<!-- @dsCard group="Brand" viewport="700x240" name="Wordmark" subtitle="LAST PLACE set in Cormorant, and the LP monogram" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 40px; background: var(--surface-page); display: flex; align-items: center; gap: 56px; }
  .wm { font-family: var(--font-serif); font-weight: 400; font-size: 40px; letter-spacing: .02em; line-height: 1; }
  .wm .lp { color: var(--lp-blue); }
  .mono { width: 96px; height: 96px; background: var(--lp-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 300; font-size: 52px; line-height: 1; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .sub { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="mono">LP</div>
  <div class="stack">
    <div class="wm">Last <span class="lp">Place</span></div>
    <div class="sub">Web design studio · est. 2022</div>
  </div>
</body>
</html>
