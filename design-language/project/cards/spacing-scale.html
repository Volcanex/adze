<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="A generous 4-based scale — the system runs on air" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--surface-page); }
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .unit { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .bar { background: var(--lp-blue); width: 18px; }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="scale">
    <div class="unit"><div class="bar" style="height:4px"></div><span class="n">1·4</span></div>
    <div class="unit"><div class="bar" style="height:8px"></div><span class="n">2·8</span></div>
    <div class="unit"><div class="bar" style="height:16px"></div><span class="n">4·16</span></div>
    <div class="unit"><div class="bar" style="height:24px"></div><span class="n">5·24</span></div>
    <div class="unit"><div class="bar" style="height:32px"></div><span class="n">6·32</span></div>
    <div class="unit"><div class="bar" style="height:48px"></div><span class="n">7·48</span></div>
    <div class="unit"><div class="bar" style="height:64px"></div><span class="n">8·64</span></div>
    <div class="unit"><div class="bar" style="height:96px"></div><span class="n">9·96</span></div>
    <div class="unit"><div class="bar" style="height:128px"></div><span class="n">10·128</span></div>
  </div>
</body>
</html>
