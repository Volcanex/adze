<!-- @dsCard group="Colors" viewport="700x150" name="Ink tints" subtitle="Black at alpha — the only greys the system needs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; border: var(--hairline); }
  .cell { height: 76px; display: flex; align-items: flex-end; padding: 6px; }
  .cell span { font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell" style="background:var(--lp-ink-90)"><span style="color:#fff">90</span></div>
    <div class="cell" style="background:var(--lp-ink-70)"><span style="color:#fff">70</span></div>
    <div class="cell" style="background:var(--lp-ink-55)"><span style="color:#fff">55</span></div>
    <div class="cell" style="background:var(--lp-ink-40)"><span style="color:#fff">40</span></div>
    <div class="cell" style="background:var(--lp-ink-22)"><span style="color:var(--lp-black)">22</span></div>
    <div class="cell" style="background:var(--lp-ink-14)"><span style="color:var(--lp-black)">14</span></div>
    <div class="cell" style="background:var(--lp-ink-08)"><span style="color:var(--lp-black)">08</span></div>
    <div class="cell" style="background:var(--lp-ink-04)"><span style="color:var(--lp-black)">04</span></div>
  </div>
</body>
</html>
